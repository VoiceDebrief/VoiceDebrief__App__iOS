name: ios

# CI is the compiler: nobody working on this repository from a Linux container can build Swift,
# so every push that touches the app or a package is built and tested here, on one Mac.
#
#   1. SGitVault      swift test on the Mac itself (no simulator): the vault engine and its vectors
#   2. build          build-for-testing for the generic iOS Simulator, unsigned, nothing booted
#   3. test           the app's unit tests on one iPhone simulator, then one iPad simulator
#   4. release build  Release for a generic iOS device, unsigned: what an archive would compile
#
#   5. TestFlight     on a green push to dev: archive, sign and upload (scripts/release/testflight.sh).
#                     Skipped, with a line in the summary, while a signing secret is missing.
#
# Failures are copied into the job summary by run-and-summarize.sh.
on:
  push:
    # dev builds, tests and uploads. A work/ branch builds and tests only, so that a session working
    # in parallel can have its Swift compiled before it merges into dev.
    branches: [dev, 'work/**']
    paths:
      - 'Apps/**'
      - 'Packages/**'
      - 'scripts/release/**'
      - '.github/workflows/ios.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'Apps/**'
      - 'Packages/**'
      - '.github/workflows/ios.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push waits for the build in progress instead of cancelling it: cancelling meant that three
# releases in a row (v0.1.2 to v0.1.4) never reached TestFlight. GitHub keeps only the newest waiting run.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: Apps/VoiceDebrief/VoiceDebrief.xcodeproj
  SCHEME: VoiceDebrief

jobs:
  mac:
    name: Build and test (one Mac)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh

      - name: Version (CI owns it: on dev, the tag this push was given)
        run: |
          # site.yml tags every push to dev on a commit placed on top of it. The app's version is that
          # tag; if it has not been written yet, it is the latest tag plus one, which is what it will be.
          v=$(tr -d ' \n' < version)
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            git fetch --quiet --tags --depth=200 origin dev || true
            tag=$(git tag --contains "$GITHUB_SHA" 2>/dev/null | sort -V | head -1)
            if [ -z "$tag" ]; then
              latest=$(git tag --list 'v[0-9]*' | sort -V | tail -1)
              IFS=. read -r a b c <<< "${latest#v}"
              tag="v$a.$b.$((c + 1))"
            fi
            v=$tag
          fi
          v=${v#v}
          echo "MARKETING_VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "**Version:** \`$v ($GITHUB_RUN_NUMBER)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: SGitVault tests (on the Mac, no simulator)
        working-directory: Packages/SGitVault
        run: ../../.github/scripts/run-and-summarize.sh "SGitVault swift test" "$RUNNER_TEMP/logs/sgitvault.log" -- swift test

      - name: Build for testing (Debug, iOS Simulator, unsigned)
        run: |
          .github/scripts/run-and-summarize.sh "Build for testing" "$RUNNER_TEMP/logs/build-for-testing.log" -- \
            xcodebuild build-for-testing -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
              MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Release build (iOS device, unsigned)
        run: |
          .github/scripts/run-and-summarize.sh "Release build" "$RUNNER_TEMP/logs/release.log" -- \
            xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
              -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-release" \
              MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Unit tests on the iPhone simulator
        timeout-minutes: 20
        run: |
          u=$(.github/scripts/pick-simulator.py iPhone)
          echo "simulator $u"
          .github/scripts/boot-simulator.sh "$u"
          .github/scripts/run-and-summarize.sh "Unit tests (iPhone)" "$RUNNER_TEMP/logs/test-iphone.log" -- \
            xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/dd" -destination "id=$u" \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 180 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO && status=0 || status=$?
          xcrun simctl shutdown "$u" 2>/dev/null || true
          exit $status

      # TestFlight: only for a green push to dev (or a manual run), and only when the signing
      # secrets exist. Everything above passed, or this step does not run.
      - name: TestFlight (archive, sign, upload)
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          EXPECTED_BUNDLE: ai.voicedebrief.app
          ENTITLEMENTS: Apps/VoiceDebrief/VoiceDebrief.entitlements
        run: |
          missing=()
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do [ -n "${!s:-}" ] || missing+=("$s"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "### TestFlight skipped: not set: ${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/release/testflight.sh

      # After the upload: the same logic tests again on an iPad. A failure here still fails the run.
      - name: Unit tests on the iPad simulator
        timeout-minutes: 20
        run: |
          u=$(.github/scripts/pick-simulator.py iPad)
          echo "simulator $u"
          .github/scripts/boot-simulator.sh "$u"
          .github/scripts/run-and-summarize.sh "Unit tests (iPad)" "$RUNNER_TEMP/logs/test-ipad.log" -- \
            xcodebuild test-without-building -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/dd" -destination "id=$u" \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 180 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO && status=0 || status=$?
          xcrun simctl shutdown "$u" 2>/dev/null || true
          exit $status

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore
