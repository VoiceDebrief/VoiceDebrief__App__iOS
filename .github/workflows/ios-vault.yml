name: iOS vault round trip

# Swift writes a vault, sgit reads it back. Carried over from PrompTugal__App__iOS with the package.
# ios.yml already runs `swift test` for Packages/SGitVault and builds the app, so this
# workflow runs only when the write path changes, weekly (so a change in sgit's format is
# noticed the week it lands), or by hand:
#   swift-writes     macOS: the write, create and sync tests export the vaults Swift wrote (SGITVAULT_ROUNDTRIP_OUT):
#                    one committed to, one created, and one created in a folder (as on a device) and then
#                    pushed to another folder (as to a server) by VaultSync
#   sgit-reads-swift Linux: sgit-ai 0.27 clones each, switches to the Swift branch,
#                    verifies every signature and compares every file
#   reference-reader Linux: the fixtures, read by the Python reference reader

on:
  push:
    branches: [dev, 'work/**']
    paths:
      - 'Packages/SGitVault/Sources/SGitVault/VaultCommitBuilder.swift'
      - 'Packages/SGitVault/Sources/SGitVault/VaultWrite.swift'
      - 'Packages/SGitVault/Sources/SGitVault/VaultCreate.swift'
      - 'Packages/SGitVault/Sources/SGitVault/VaultSync.swift'
      - 'Packages/SGitVault/Tests/SGitVaultTests/SyncTests.swift'
      - 'Packages/SGitVault/Tests/SGitVaultTests/CreateTests.swift'
      - 'Packages/SGitVault/Sources/SGitVault/PythonJSON.swift'
      - 'Packages/SGitVault/Sources/SGitVault/CanonicalJSON.swift'
      - 'Packages/SGitVault/Sources/SGitVault/VaultCrypto.swift'
      - 'Packages/SGitVault/Tests/SGitVaultTests/WriteTests.swift'
      - 'Packages/SGitVault/Tests/Fixtures/**'
      - '.github/workflows/ios-vault.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-vault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-writes:
    name: Swift writes vaults
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write tests, exporting what Swift wrote
        working-directory: Packages/SGitVault
        env:
          SGITVAULT_ROUNDTRIP_OUT: ${{ runner.temp }}/roundtrip
        run: |
          set -o pipefail
          swift test --filter 'WriteTests|CreateTests|SyncTests' 2>&1 | tee "$RUNNER_TEMP/write-tests.log" || {
            { echo "### ❌ Swift write tests failed"; echo '```'
              grep -E "error:|failed" "$RUNNER_TEMP/write-tests.log" | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: swift-written-vaults
          path: ${{ runner.temp }}/roundtrip/
          if-no-files-found: error

  sgit-reads-swift:
    name: sgit reads the vaults Swift wrote
    needs: swift-writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install sgit-ai==0.27.0
      - uses: actions/download-artifact@v4
        with:
          name: swift-written-vaults
          path: ${{ runner.temp }}/roundtrip
      - name: sgit clones, switches branch, verifies signatures, compares files
        run: |
          set -o pipefail
          python3 -I Packages/SGitVault/Tests/Fixtures/sgit_reads_swift.py "$RUNNER_TEMP/roundtrip" | tee -a "$GITHUB_STEP_SUMMARY"

  reference-reader:
    name: Fixtures read by the Python reference reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cryptography
      - run: python3 -I Packages/SGitVault/Tests/Fixtures/reference_reader.py Packages/SGitVault/Tests/Fixtures
