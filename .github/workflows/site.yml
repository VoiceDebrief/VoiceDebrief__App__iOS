name: site

# validate -> tag -> deploy, on the pattern of VoiceDebrief MeetScribe's deploy-pages.yml.
#
#   1. validate     the gate (website/admin/validate.mjs): generated pages current, links and anchors,
#                   no key-shaped string anywhere in the repository, house style. Runs on pull requests too.
#   2. increment-tag  on a push to dev: CI works out the next version from the latest tag, writes the
#                   version file and tags. Nobody edits the version file by hand.
#   3. deploy       stamps that version into the pages and publishes website/ to GitHub Pages, from dev
#                   only, never when validation failed.
#
# GitHub Pages must be set to "GitHub Actions" as its source in the repository settings.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node version (the runner's own; 20 or later)
        run: node -e "const v=+process.versions.node.split('.')[0]; console.log('node', process.version); if (v < 20) process.exit(1)"
      - name: Validate the site and the repository
        run: node website/admin/validate.mjs

  increment-tag:
    # CI owns the version file, as in the other VoiceDebrief and SGraph repositories (the behaviour of
    # owasp-sbot/OSBot-GitHub-Actions git__increment-tag, written out here so that it retries when
    # another push lands first): every push to dev is a release. The latest tag's last number goes up
    # by one, the version file and the README badge are rewritten, and that commit is tagged. The
    # commit is pushed with GITHUB_TOKEN, which starts no workflow, so there is no loop.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Increment the tag and write the version file
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --tags origin dev
            git reset --quiet --hard origin/dev
            LATEST=$(git tag --list 'v[0-9]*' | sort -V | tail -1)
            [ -n "$LATEST" ] || LATEST=v0.0.0
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            NEW="v$MAJOR.$MINOR.$((PATCH + 1))"
            echo "$NEW" > version
            sed -i "s/release-v[0-9]*\.[0-9]*\.[0-9]*/release-$NEW/" README.md
            git add version README.md
            git commit --quiet -m "Update release badge and version file"
            if git push --quiet origin HEAD:dev; then
              git tag "$NEW"
              git push --quiet origin "refs/tags/$NEW"
              echo "tagged $(git rev-parse --short HEAD) as $NEW" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "dev moved, trying again ($attempt)"
            sleep $((attempt * 3))
          done
          echo "::error::could not push the version commit"; exit 1

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, increment-tag]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && needs.validate.result == 'success' && (needs.increment-tag.result == 'success' || needs.increment-tag.result == 'skipped')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev            # the commit CI has just written the version into
          persist-credentials: false
      - name: Stamp the version into the pages
        run: SITE_VERSION="$(tr -d ' \n' < version)" node website/admin/build.mjs
      - name: Assemble the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a website/ "$RUNNER_TEMP/site/" --exclude 'admin'
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
