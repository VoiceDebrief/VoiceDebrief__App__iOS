<text x="420" y="230" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="30" font-weight="800" fill="#0B1B2B">VoiceDebrief</text>
<text x="420" y="266" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="19" fill="#45596E">A voice (the bars) becoming a note</text>
<text x="420" y="292" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="19" fill="#45596E">(the lines). Accent: signal green.</text>
<rect x="420" y="320" width="56" height="56" rx="14" fill="#0E9E72"/><rect x="488" y="320" width="56" height="56" rx="14" fill="#9FD8C4"/><rect x="556" y="320" width="56" height="56" rx="14" fill="#0B1B2B"/>
<text x="1140" y="230" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="30" font-weight="800" fill="#0B1B2B">SGit Vaults</text>
<text x="1140" y="266" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="19" fill="#45596E">A vault whose door is a history</text>
<text x="1140" y="292" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="19" fill="#45596E">(a commit graph). Accent: indigo.</text>
<rect x="1140" y="320" width="56" height="56" rx="14" fill="#4F5BD5"/><rect x="1208" y="320" width="56" height="56" rx="14" fill="#12C08A"/><rect x="1276" y="320" width="56" height="56" rx="14" fill="#0B1B2B"/>
<text x="80" y="500" font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" font-size="17" fill="#6B7F94">Red only for recording and failure. Amber only for something degraded. Never a colour for decoration alone.</text>
