  <radialGradient id="sgh" cx="0.72" cy="0.78" r="0.7"><stop offset="0" stop-color="#4F5BD5" stop-opacity="0.95"/><stop offset="1" stop-color="#4F5BD5" stop-opacity="0"/></radialGradient>
