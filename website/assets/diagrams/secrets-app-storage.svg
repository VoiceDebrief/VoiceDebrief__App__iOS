<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 750" width="980" height="750" role="img" aria-labelledby="t d">
<title id="t">The secrets app: one vault, kept as a file in the stores you already have</title>
<desc id="d">Three locks open the vault key: iCloud Keychain, a passkey, a printed recovery code. The vault lives on the device as a folder of encrypted objects. After every change it is written to each store: A, one file in iCloud Drive with five past copies; B, this device; C, a copy you keep, which the sgit command can open; D, optionally, the SG/Send server. Below, two devices that edited offline: their files join by union of objects, then the two heads merge.</desc>
<style>
  .bg{fill:#F8FAFC} .box{fill:#FFFFFF;stroke:#C9D5E0;stroke-width:1.2} .zone{fill:none;stroke:#9FB2C4;stroke-width:1.2;stroke-dasharray:2 4}
  .live{stroke:#0E9E72;stroke-width:2} .test{stroke:#8A6A18;stroke-width:1.6} .plan{stroke:#6B7F94;stroke-width:1.4;stroke-dasharray:6 5}
  .t{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .s{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .c{font:400 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#45596E}
  .z{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6B7F94;letter-spacing:.06em}
  .h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .l{font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .a{fill:none;stroke:#45596E;stroke-width:1.5} .a.live{stroke:#0E9E72;stroke-width:2} .a.plan{stroke:#6B7F94;stroke-dasharray:6 5}
  .hd{fill:#45596E} .hd.plan{fill:#6B7F94} .n{fill:#0E9E72} .nt{font:700 12px -apple-system,Helvetica,Arial,sans-serif;fill:#FFFFFF}
  .dot{fill:#FFFFFF;stroke:#45596E;stroke-width:1.6} .dot.m{fill:#0E9E72;stroke:#0E9E72}
  .lb{fill:#F8FAFC}
  @media (prefers-color-scheme: dark){
    .bg{fill:#08131F} .box{fill:#0E1E2E;stroke:#2B3F53} .zone{stroke:#48607A} .live{stroke:#12C08A} .test{stroke:#F0B429} .plan{stroke:#8CA2B8}
    .t,.h{fill:#F2F6FA} .s,.l,.c{fill:#A8BBCE} .z{fill:#8CA2B8} .a{stroke:#A8BBCE} .a.live{stroke:#12C08A} .a.plan{stroke:#8CA2B8}
    .hd{fill:#A8BBCE} .hd.plan{fill:#8CA2B8} .n{fill:#12C08A} .nt{fill:#04231A} .lb{fill:#08131F}
    .dot{fill:#0E1E2E;stroke:#A8BBCE} .dot.m{fill:#12C08A;stroke:#12C08A}
  }
</style>
<rect class="bg" width="980" height="750" rx="14"/>
<text class="h" x="24" y="34">One vault, kept as a file in the stores you already have</text>

<!-- Locks -->
<rect class="zone" x="20" y="52" width="320" height="258" rx="14"/>
<text class="z" x="34" y="72">THE LOCKS: ANY ONE OPENS IT</text>
<rect class="box test" x="36" y="84" width="288" height="66" rx="10"/>
<text class="t" x="48" y="105">1 · iCloud Keychain</text>
<text class="s" x="48" y="123">The vault key as a synchronised item, as the</text>
<text class="s" x="48" y="139">SGit app keeps it today. Nothing to remember</text>
<rect class="box plan" x="36" y="160" width="288" height="66" rx="10"/>
<text class="t" x="48" y="181">2 · A passkey</text>
<text class="s" x="48" y="199">Its PRF output, after Face ID, wraps the key.</text>
<text class="s" x="48" y="215">Can be a hardware key, outside Apple</text>
<rect class="box plan" x="36" y="236" width="288" height="66" rx="10"/>
<text class="t" x="48" y="257">3 · A recovery code</text>
<text class="s" x="48" y="275">26 characters, printed once at setup. With</text>
<text class="s" x="48" y="291">the file alone, it opens everything</text>

<!-- The vault on the device -->
<rect class="box test" x="372" y="108" width="246" height="150" rx="10"/>
<text class="t" x="384" y="130">The vault on this device</text>
<text class="s" x="384" y="150">A folder of encrypted objects,</text>
<text class="s" x="384" y="166">each named by its hash; a secret</text>
<text class="s" x="384" y="182">is one file; every change is a</text>
<text class="s" x="384" y="198">signed commit. Read, add and</text>
<text class="s" x="384" y="214">change with no network.</text>
<text class="s" x="384" y="238">This is the truth; stores are copies</text>
<path class="a" d="M324 117 L372 160"/>
<path class="a plan" d="M324 193 L372 183"/>
<path class="a plan" d="M324 269 L372 210"/>
<polygon class="hd" points="372.0,160.0 362.6,157.6 367.5,152.1"/>
<polygon class="hd plan" points="372.0,183.0 363.6,188.4 362.1,181.2"/>
<polygon class="hd plan" points="372.0,210.0 368.8,218.6 363.2,214.0"/>

<!-- What a store sees -->
<rect class="box live" x="650" y="108" width="310" height="150" rx="10"/>
<text class="t" x="662" y="130">What every store holds</text>
<text class="s" x="662" y="150">Ciphertext only: objects, their sizes and</text>
<text class="s" x="662" y="166">count, the time the file changed. Never a</text>
<text class="s" x="662" y="182">name, a site, a password or a key. Apple,</text>
<text class="s" x="662" y="198">a stolen laptop or our server see the same:</text>
<text class="s" x="662" y="214">a small file nobody can open without one</text>
<text class="s" x="662" y="230">of the three locks</text>
<path class="a" d="M618 183 L650 183"/>
<polygon class="hd" points="650.0,183.0 641.8,186.7 641.8,179.3"/>

<!-- Stores -->
<rect class="zone" x="20" y="330" width="940" height="196" rx="14" transform="translate(0,22)"/>
<text class="z" x="34" y="372">THE STORES</text>
<path class="a" d="M495 258 L495 326 L134 326 L134 392"/>
<path class="a" d="M495 326 L366 326 L366 392"/>
<path class="a" d="M495 326 L598 326 L598 392"/>
<path class="a plan" d="M495 326 L830 326 L830 392"/>
<polygon class="hd" points="134.0,392.0 130.3,383.8 137.7,383.8"/>
<polygon class="hd" points="366.0,392.0 362.3,383.8 369.7,383.8"/>
<polygon class="hd" points="598.0,392.0 594.3,383.8 601.7,383.8"/>
<polygon class="hd plan" points="830.0,392.0 826.3,383.8 833.7,383.8"/>
<rect class="lb" x="150" y="317" width="200" height="18" rx="3"/>
<text class="l" x="250" y="330" text-anchor="middle">written after every change</text>
<rect class="lb" x="620" y="317" width="180" height="18" rx="3"/>
<text class="l" x="710" y="330" text-anchor="middle">read and merged on open</text>

<rect class="box plan" x="30" y="392" width="208" height="122" rx="10"/>
<text class="t" x="42" y="414">A · iCloud Drive</text>
<text class="s" x="42" y="432">The default. One file in the</text>
<text class="s" x="42" y="448">app's folder, replaced whole on</text>
<text class="s" x="42" y="464">each change; the last five</text>
<text class="s" x="42" y="480">copies kept beside it</text>
<text class="c" x="42" y="502">My secrets.sgvault</text>

<rect class="box test" x="262" y="392" width="208" height="122" rx="10"/>
<text class="t" x="274" y="414">B · This device</text>
<text class="s" x="274" y="432">The folder above, where the</text>
<text class="s" x="274" y="448">SGit app keeps vaults today.</text>
<text class="s" x="274" y="464">Every device is a whole copy,</text>
<text class="s" x="274" y="480">so a lost iCloud write is never</text>
<text class="s" x="274" y="496">a lost secret</text>

<rect class="box plan" x="494" y="392" width="208" height="122" rx="10"/>
<text class="t" x="506" y="414">C · A copy you keep</text>
<text class="s" x="506" y="432">Files, AirDrop, a USB stick.</text>
<text class="s" x="506" y="448">Opened on any computer with</text>
<text class="s" x="506" y="464">the open sgit command:</text>
<text class="c" x="506" y="486">sgit clone --transport</text>
<text class="c" x="506" y="502">  local --base-url DIR</text>

<rect class="box test" x="726" y="392" width="222" height="122" rx="10"/>
<text class="t" x="738" y="414">D · SG/Send server</text>
<text class="s" x="738" y="432">Optional, never the default.</text>
<text class="s" x="738" y="448">For a browser, a teammate not</text>
<text class="s" x="738" y="464">on iCloud, or one more copy.</text>
<text class="s" x="738" y="480">Push and pull are built in the</text>
<text class="s" x="738" y="496">SGit app, untried live</text>

<!-- Merge -->
<rect class="zone" x="20" y="560" width="940" height="142" rx="14"/>
<text class="z" x="34" y="580">TWO DEVICES EDITED OFFLINE: NOTHING IS LOST</text>
<path class="a" d="M70 642 L170 612 L300 612 L400 642"/>
<path class="a" d="M70 642 L170 672 L300 672 L400 642"/>
<circle class="dot" cx="70" cy="642" r="7"/>
<circle class="dot" cx="170" cy="612" r="7"/>
<circle class="dot" cx="170" cy="672" r="7"/>
<circle class="dot m" cx="400" cy="642" r="9"/>
<text class="l" x="62" y="626">Wi-Fi</text>
<text class="l" x="182" y="604">iPhone: add bank</text>
<text class="l" x="182" y="692">iPad: add router</text>
<text class="l" x="414" y="646">merged</text>
<text class="s" x="490" y="604">iCloud keeps both files as conflict versions. The objects</text>
<text class="s" x="490" y="620">are named by their hash, so the two files join by union:</text>
<text class="s" x="490" y="636">the same name is always the same bytes. Then the two</text>
<text class="s" x="490" y="652">heads merge as git does: different secrets on their own,</text>
<text class="s" x="490" y="668">the same secret changed on both asks which is right.</text>
<text class="s" x="490" y="684">Tried with sgit 0.27: 31 objects, 17 KB as a zip.</text>

<!-- Legend -->
<rect class="box live" x="40" y="720" width="26" height="16" rx="4"/><text class="l" x="74" y="732">Holds today, by design</text>
<rect class="box test" x="330" y="720" width="26" height="16" rx="4"/><text class="l" x="364" y="732">In the SGit app, not yet confirmed on a device</text>
<rect class="box plan" x="690" y="720" width="26" height="16" rx="4"/><text class="l" x="724" y="732">Proposed, not built</text>
</svg>
