<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d">
<title id="t">Messages and secrets, over inboxes</title>
<desc id="d">A message or a secret is sealed on the sender’s device to the recipient’s public key and dropped into the recipient’s inbox on the vault server. The recipient’s device checks for new messages when the app opens, then every minute while in use, less often when idle, and opens them with its private key.</desc>
<style>
  .bg{fill:#F8FAFC} .box{fill:#FFFFFF;stroke:#C9D5E0;stroke-width:1.2} .zone{fill:none;stroke:#9FB2C4;stroke-width:1.2;stroke-dasharray:2 4}
  .live{stroke:#0E9E72;stroke-width:2} .test{stroke:#8A6A18;stroke-width:1.6} .plan{stroke:#6B7F94;stroke-width:1.4;stroke-dasharray:6 5}
  .t{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .s{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .z{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6B7F94;letter-spacing:.06em}
  .h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .l{font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .a{fill:none;stroke:#45596E;stroke-width:1.5} .a.live{stroke:#0E9E72;stroke-width:2} .a.plan{stroke:#6B7F94;stroke-dasharray:6 5}
  .hd{fill:#45596E} .hd.live{fill:#0E9E72} .hd.plan{fill:#6B7F94} .n{fill:#0E9E72} .nt{font:700 12px -apple-system,Helvetica,Arial,sans-serif;fill:#FFFFFF}
  .lb{fill:#F8FAFC}
  @media (prefers-color-scheme: dark){
    .bg{fill:#08131F} .box{fill:#0E1E2E;stroke:#2B3F53} .zone{stroke:#48607A} .live{stroke:#12C08A} .test{stroke:#F0B429} .plan{stroke:#8CA2B8}
    .t,.h{fill:#F2F6FA} .s,.l{fill:#A8BBCE} .z{fill:#8CA2B8} .a{stroke:#A8BBCE} .a.live{stroke:#12C08A} .a.plan{stroke:#8CA2B8}
    .hd{fill:#A8BBCE} .hd.live{fill:#12C08A} .hd.plan{fill:#8CA2B8} .n{fill:#12C08A} .nt{fill:#04231A} .lb{fill:#08131F}
  }
</style>
<rect class="bg" width="1080" height="640" rx="14"/>
<text class="h" x="24" y="34">Messages and secrets, over inboxes</text>
<rect class="zone" x="20" y="52" width="300" height="400" rx="14"/>
<text class="z" x="34" y="72">YOUR DEVICE</text>
<rect class="box test" x="40" y="86" width="260" height="96" rx="10"/>
<text class="t" x="52" y="108">Write</text>
<text class="s" x="52" y="126">A message, a voice note, a</text>
<text class="s" x="52" y="142">secret, a vault invitation</text>
<rect class="box live" x="40" y="206" width="260" height="96" rx="10"/>
<text class="t" x="52" y="228">Seal</text>
<text class="s" x="52" y="246">To their public key, signed</text>
<text class="s" x="52" y="262">with yours, on this device</text>
<rect class="box plan" x="40" y="326" width="260" height="106" rx="10"/>
<text class="t" x="52" y="348">Remember</text>
<text class="s" x="52" y="366">What you sent, to whom, when;</text>
<text class="s" x="52" y="382">which secrets each contact</text>
<text class="s" x="52" y="398">holds, so they can be changed</text>
<path class="a " d="M170 182 L170 206"/>
<polygon class="hd " points="170.0,206.0 166.3,197.8 173.7,197.8"/>
<rect class="zone" x="380" y="52" width="320" height="400" rx="14"/>
<text class="z" x="394" y="72">THE VAULT SERVER</text>
<rect class="box live" x="400" y="150" width="280" height="150" rx="10"/>
<text class="t" x="412" y="172">Their inbox</text>
<text class="s" x="412" y="190">A list of sealed messages.</text>
<text class="s" x="412" y="206">The sender can add, not read,</text>
<text class="s" x="412" y="222">list or delete. The server</text>
<text class="s" x="412" y="238">sees sizes and times only</text>
<path class="a live" d="M300 254 L400 225"/>
<polygon class="hd live" points="400.0,225.0 393.1,230.8 391.1,223.8"/>
<rect class="lb" x="326" y="216" width="48" height="18" rx="3"/>
<text class="l" x="350" y="228" text-anchor="middle">sealed</text>
<rect class="zone" x="760" y="52" width="300" height="400" rx="14"/>
<text class="z" x="774" y="72">THEIR DEVICE</text>
<rect class="box plan" x="780" y="86" width="260" height="110" rx="10"/>
<text class="t" x="792" y="108">Check for new</text>
<text class="s" x="792" y="126">When the app opens; every</text>
<text class="s" x="792" y="142">minute while it is in use;</text>
<text class="s" x="792" y="158">backing off when idle</text>
<rect class="box live" x="780" y="220" width="260" height="96" rx="10"/>
<text class="t" x="792" y="242">Open</text>
<text class="s" x="792" y="260">With their private key; check</text>
<text class="s" x="792" y="276">your signature</text>
<rect class="box plan" x="780" y="340" width="260" height="92" rx="10"/>
<text class="t" x="792" y="362">Act</text>
<text class="s" x="792" y="380">Read it, file it, or keep the</text>
<text class="s" x="792" y="396">secret in their secrets store</text>
<path class="a plan" d="M680 210 L780 140"/>
<polygon class="hd plan" points="780.0,140.0 775.4,147.7 771.2,141.7"/>
<rect class="lb" x="688" y="148" width="79" height="18" rx="3"/>
<text class="l" x="728" y="160" text-anchor="middle">list, fetch</text>
<path class="a " d="M910 196 L910 220"/>
<polygon class="hd " points="910.0,220.0 906.3,211.8 913.7,211.8"/>
<path class="a " d="M910 316 L910 340"/>
<polygon class="hd " points="910.0,340.0 906.3,331.8 913.7,331.8"/>
<text class="t" x="40" y="486" text-anchor="start">What a message can carry</text>
<text class="t" x="40" y="506" text-anchor="start">A message or a voice note</text>
<text class="s" x="40" y="524" text-anchor="start">Text, or audio with its transcript and debrief: what VoiceDebrief already sends</text>
<text class="t" x="560" y="506" text-anchor="start">A secret</text>
<text class="s" x="560" y="524" text-anchor="start">The server access key, a vault key, a password: the secrets manager</text>
<text class="t" x="40" y="550" text-anchor="start">An invitation</text>
<text class="s" x="40" y="568" text-anchor="start">A vault and the right to read or add to it</text>
<text class="t" x="560" y="550" text-anchor="start">A card</text>
<text class="s" x="560" y="568" text-anchor="start">Your contact card, so that they can write back</text>
<rect class="box live" x="40" y="606" width="26" height="16" rx="4"/><text class="l" x="74" y="618">Seen working on the owner’s devices</text>
<rect class="box test" x="330" y="606" width="26" height="16" rx="4"/><text class="l" x="364" y="618">In the build, not yet confirmed</text>
<rect class="box plan" x="620" y="606" width="26" height="16" rx="4"/><text class="l" x="654" y="618">Decided, not built</text>
</svg>
