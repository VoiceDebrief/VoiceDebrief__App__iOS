<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="t d">
<title id="t">Four keys, where each lives, and who vouches for whom</title>
<desc id="d">A chain from the public register to a commit: the register’s root vouches for a person, the person’s key vouches for a device key, the device key signs each commit. Beside it, the vault key, which encrypts the vault and is carried by iCloud Keychain.</desc>
<style>
  .bg{fill:#F8FAFC} .box{fill:#FFFFFF;stroke:#C9D5E0;stroke-width:1.2} .zone{fill:none;stroke:#9FB2C4;stroke-width:1.2;stroke-dasharray:2 4}
  .live{stroke:#0E9E72;stroke-width:2} .test{stroke:#8A6A18;stroke-width:1.6} .plan{stroke:#6B7F94;stroke-width:1.4;stroke-dasharray:6 5}
  .t{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .s{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .z{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6B7F94;letter-spacing:.06em}
  .h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .l{font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .a{fill:none;stroke:#45596E;stroke-width:1.5} .a.live{stroke:#0E9E72;stroke-width:2} .a.plan{stroke:#6B7F94;stroke-dasharray:6 5}
  .hd{fill:#45596E} .hd.live{fill:#0E9E72} .hd.plan{fill:#6B7F94} .n{fill:#0E9E72} .nt{font:700 12px -apple-system,Helvetica,Arial,sans-serif;fill:#FFFFFF}
  .lb{fill:#F8FAFC}
  @media (prefers-color-scheme: dark){
    .bg{fill:#08131F} .box{fill:#0E1E2E;stroke:#2B3F53} .zone{stroke:#48607A} .live{stroke:#12C08A} .test{stroke:#F0B429} .plan{stroke:#8CA2B8}
    .t,.h{fill:#F2F6FA} .s,.l{fill:#A8BBCE} .z{fill:#8CA2B8} .a{stroke:#A8BBCE} .a.live{stroke:#12C08A} .a.plan{stroke:#8CA2B8}
    .hd{fill:#A8BBCE} .hd.live{fill:#12C08A} .hd.plan{fill:#8CA2B8} .n{fill:#12C08A} .nt{fill:#04231A} .lb{fill:#08131F}
  }
</style>
<rect class="bg" width="980" height="600" rx="14"/>
<text class="h" x="24" y="34">Four keys, where each lives, and who vouches for whom</text>
<rect class="zone" x="20" y="52" width="600" height="500" rx="14"/>
<text class="z" x="34" y="72">WHO SIGNED THIS? A CHAIN OF SIGNATURES</text>
<rect class="box plan" x="60" y="84" width="520" height="70" rx="10"/>
<text class="t" x="72" y="106">The register’s root, at pki.sgit.ai</text>
<text class="s" x="72" y="124">A fingerprint the app pins in its code. Optional: the app works without the register</text>
<rect class="box plan" x="60" y="200" width="520" height="86" rx="10"/>
<text class="t" x="72" y="222">Your key pair: who you are</text>
<text class="s" x="72" y="240">Signs as you; lets others encrypt to you. Must travel to all your devices:</text>
<text class="s" x="72" y="256">iCloud Keychain to begin with, later a master vault opened by a passkey.</text>
<text class="s" x="72" y="272">Never the Secure Enclave, which cannot let a key out</text>
<rect class="box live" x="60" y="332" width="520" height="86" rx="10"/>
<text class="t" x="72" y="354">The device’s key: which device did this</text>
<text class="s" x="72" y="372">Made on the device and never leaves it. Meant to be lost with the device</text>
<text class="s" x="72" y="388">or the app. Its public half is written into the vault beside the data.</text>
<text class="s" x="72" y="404">Today it lives in the Keychain; the Secure Enclave is decided, not built</text>
<rect class="box live" x="60" y="464" width="520" height="70" rx="10"/>
<text class="t" x="72" y="486">A commit in a vault</text>
<text class="s" x="72" y="504">The files of one note, encrypted, with a signature that every reader checks</text>
<path class="a plan" d="M320 154 L320 200"/>
<polygon class="hd plan" points="320.0,200.0 316.3,191.8 323.7,191.8"/>
<rect class="lb" x="107" y="170" width="426" height="18" rx="3"/>
<text class="l" x="320" y="182" text-anchor="middle">verifies you (or an anchor who met you), and holds your delegation</text>
<path class="a plan" d="M320 286 L320 332"/>
<polygon class="hd plan" points="320.0,332.0 316.3,323.8 323.7,323.8"/>
<rect class="lb" x="139" y="302" width="363" height="18" rx="3"/>
<text class="l" x="320" y="314" text-anchor="middle">a signed statement in the vault: this device key is mine</text>
<path class="a live" d="M320 418 L320 464"/>
<polygon class="hd live" points="320.0,464.0 316.3,455.8 323.7,455.8"/>
<rect class="lb" x="299" y="434" width="42" height="18" rx="3"/>
<text class="l" x="320" y="446" text-anchor="middle">signs</text>
<rect class="zone" x="650" y="52" width="310" height="500" rx="14"/>
<text class="z" x="664" y="72">WHO CAN READ THIS?</text>
<rect class="box live" x="670" y="84" width="270" height="104" rx="10"/>
<text class="t" x="682" y="106">The vault key</text>
<text class="s" x="682" y="124">One string: where the vault is,</text>
<text class="s" x="682" y="140">the right to write to it, and the</text>
<text class="s" x="682" y="156">root of its encryption. Whoever</text>
<text class="s" x="682" y="172">has it can open the vault</text>
<rect class="box plan" x="670" y="232" width="270" height="104" rx="10"/>
<text class="t" x="682" y="254">Kept in the Keychain</text>
<text class="s" x="682" y="272">Today on this device only.</text>
<text class="s" x="682" y="288">Decided: synchronised through</text>
<text class="s" x="682" y="304">iCloud Keychain, on by default,</text>
<text class="s" x="682" y="320">so it reaches your other devices</text>
<rect class="box live" x="670" y="380" width="270" height="120" rx="10"/>
<text class="t" x="682" y="402">What the server holds</text>
<text class="s" x="682" y="420">Encrypted objects named by a</text>
<text class="s" x="682" y="436">hash, and the hash of the write</text>
<text class="s" x="682" y="452">key. It can check a writer is</text>
<text class="s" x="682" y="468">allowed without being able to</text>
<text class="s" x="682" y="484">read anything</text>
<path class="a " d="M805 188 L805 232"/>
<polygon class="hd " points="805.0,232.0 801.3,223.8 808.7,223.8"/>
<path class="a " d="M805 336 L805 380"/>
<polygon class="hd " points="805.0,380.0 801.3,371.8 808.7,371.8"/>
<rect class="lb" x="715" y="350" width="180" height="18" rx="3"/>
<text class="l" x="805" y="362" text-anchor="middle">derives read and write keys</text>
<rect class="box live" x="40" y="572" width="26" height="16" rx="4"/><text class="l" x="74" y="584">Seen working on the owner’s devices</text>
<rect class="box test" x="330" y="572" width="26" height="16" rx="4"/><text class="l" x="364" y="584">In the build, not yet confirmed</text>
<rect class="box plan" x="620" y="572" width="26" height="16" rx="4"/><text class="l" x="654" y="584">Decided, not built</text>
</svg>
