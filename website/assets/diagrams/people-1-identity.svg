<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d">
<title id="t">From the first launch: a person, their keys and their inbox</title>
<desc id="d">Installing the app makes a key pair for the person and one for the device, a contact card that can be shown as a QR code, and an inbox that only the person can read. A public register is optional.</desc>
<style>
  .bg{fill:#F8FAFC} .box{fill:#FFFFFF;stroke:#C9D5E0;stroke-width:1.2} .zone{fill:none;stroke:#9FB2C4;stroke-width:1.2;stroke-dasharray:2 4}
  .live{stroke:#0E9E72;stroke-width:2} .test{stroke:#8A6A18;stroke-width:1.6} .plan{stroke:#6B7F94;stroke-width:1.4;stroke-dasharray:6 5}
  .t{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .s{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .z{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6B7F94;letter-spacing:.06em}
  .h{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1B2B}
  .l{font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#45596E}
  .a{fill:none;stroke:#45596E;stroke-width:1.5} .a.live{stroke:#0E9E72;stroke-width:2} .a.plan{stroke:#6B7F94;stroke-dasharray:6 5}
  .hd{fill:#45596E} .hd.live{fill:#0E9E72} .hd.plan{fill:#6B7F94} .n{fill:#0E9E72} .nt{font:700 12px -apple-system,Helvetica,Arial,sans-serif;fill:#FFFFFF}
  .lb{fill:#F8FAFC}
  @media (prefers-color-scheme: dark){
    .bg{fill:#08131F} .box{fill:#0E1E2E;stroke:#2B3F53} .zone{stroke:#48607A} .live{stroke:#12C08A} .test{stroke:#F0B429} .plan{stroke:#8CA2B8}
    .t,.h{fill:#F2F6FA} .s,.l{fill:#A8BBCE} .z{fill:#8CA2B8} .a{stroke:#A8BBCE} .a.live{stroke:#12C08A} .a.plan{stroke:#8CA2B8}
    .hd{fill:#A8BBCE} .hd.live{fill:#12C08A} .hd.plan{fill:#8CA2B8} .n{fill:#12C08A} .nt{fill:#04231A} .lb{fill:#08131F}
  }
</style>
<rect class="bg" width="1080" height="600" rx="14"/>
<text class="h" x="24" y="34">From the first launch: a person, their keys and their inbox</text>
<rect class="zone" x="20" y="52" width="700" height="500" rx="14"/>
<text class="z" x="34" y="72">MADE ON THE DEVICE THE FIRST TIME THE APP OPENS</text>
<rect class="box test" x="40" y="86" width="320" height="100" rx="10"/>
<text class="t" x="52" y="108">Your key pair: who you are</text>
<text class="s" x="52" y="126">Signs as you; others encrypt to you.</text>
<text class="s" x="52" y="142">Kept in iCloud Keychain, so it reaches</text>
<text class="s" x="52" y="158">your other devices</text>
<rect class="box test" x="380" y="86" width="320" height="100" rx="10"/>
<text class="t" x="392" y="108">This device&#x27;s key</text>
<text class="s" x="392" y="126">Signs what this device writes.</text>
<text class="s" x="392" y="142">Never leaves it (Secure Enclave).</text>
<text class="s" x="392" y="158">Your key vouches for it</text>
<rect class="box live" x="40" y="220" width="320" height="110" rx="10"/>
<text class="t" x="52" y="242">An inbox</text>
<text class="s" x="52" y="260">An append lane on a vault of yours.</text>
<text class="s" x="52" y="276">Anyone with its link can drop a sealed</text>
<text class="s" x="52" y="292">message in; only your key opens it</text>
<rect class="box plan" x="380" y="220" width="320" height="110" rx="10"/>
<text class="t" x="392" y="242">Your contact card</text>
<text class="s" x="392" y="260">Your name, your public keys and your</text>
<text class="s" x="392" y="276">inbox&#x27;s link, signed by you. Safe to</text>
<text class="s" x="392" y="292">show: it cannot be read with</text>
<rect class="box plan" x="40" y="364" width="660" height="90" rx="10"/>
<text class="t" x="52" y="386">The secrets store</text>
<text class="s" x="52" y="404">Access keys, vault keys, passwords and tokens, in the Keychain (iCloud Keychain by default).</text>
<text class="s" x="52" y="420">Each secret knows who you gave it to, and when. Nothing leaves the device unsealed.</text>
<path class="a " d="M200 186 L200 220"/>
<polygon class="hd " points="200.0,220.0 196.3,211.8 203.7,211.8"/>
<path class="a " d="M360 275 L380 275"/>
<polygon class="hd " points="380.0,275.0 371.8,278.7 371.8,271.3"/>
<path class="a " d="M330 186 L330 203 L520 203 L520 220"/>
<polygon class="hd " points="520.0,220.0 516.3,211.8 523.7,211.8"/>
<rect class="box plan" x="40" y="476" width="660" height="56" rx="10"/>
<text class="t" x="52" y="498">One server access key, held like any other secret</text>
<text class="s" x="52" y="516">It is what lets you write to a vault server. It arrives as a sealed message from whoever invites you.</text>
<rect class="zone" x="760" y="52" width="300" height="500" rx="14"/>
<text class="z" x="774" y="72">OUTSIDE THE DEVICE</text>
<rect class="box live" x="780" y="86" width="260" height="120" rx="10"/>
<text class="t" x="792" y="108">pki.sgit.ai</text>
<text class="s" x="792" y="126">A public register of people</text>
<text class="s" x="792" y="142">and their public keys. Optional:</text>
<text class="s" x="792" y="158">publish your card there, or</text>
<text class="s" x="792" y="174">look someone up</text>
<rect class="box live" x="780" y="236" width="260" height="110" rx="10"/>
<text class="t" x="792" y="258">The vault server</text>
<text class="s" x="792" y="276">Holds inboxes and vaults as</text>
<text class="s" x="792" y="292">ciphertext. Cannot read a</text>
<text class="s" x="792" y="308">message or a secret</text>
<rect class="box live" x="780" y="376" width="260" height="110" rx="10"/>
<text class="t" x="792" y="398">Agents</text>
<text class="s" x="792" y="416">A Claude session is a contact</text>
<text class="s" x="792" y="432">like any other: a card, an</text>
<text class="s" x="792" y="448">inbox, a key</text>
<path class="a live" d="M700 300 L780 300"/>
<polygon class="hd live" points="780.0,300.0 771.8,303.7 771.8,296.3"/>
<path class="a plan" d="M700 248 L736 248 L736 146 L780 146"/>
<polygon class="hd plan" points="780.0,146.0 771.8,149.7 771.8,142.3"/>
<rect class="lb" x="645" y="184" width="92" height="32" rx="3"/>
<text class="l" x="732" y="196" text-anchor="end">publish</text>
<text class="l" x="732" y="210" text-anchor="end">if you choose</text>
<rect class="box live" x="40" y="572" width="26" height="16" rx="4"/><text class="l" x="74" y="584">Seen working on the owner’s devices</text>
<rect class="box test" x="330" y="572" width="26" height="16" rx="4"/><text class="l" x="364" y="584">In the build, not yet confirmed</text>
<rect class="box plan" x="620" y="572" width="26" height="16" rx="4"/><text class="l" x="654" y="584">Decided, not built</text>
</svg>
